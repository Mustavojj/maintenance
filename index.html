<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GRAM TOWN - Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .maintenance-container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 32px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #4A7CF7;
            box-shadow: 0 0 60px rgba(74, 124, 247, 0.3);
            object-fit: cover;
            margin: 0 auto 16px;
        }

        .app-name {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #4A7CF7, #6C5CE7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .maintenance-icon {
            font-size: 64px;
            color: #4A7CF7;
            margin: 24px 0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #FF9500;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .status-text {
            font-size: 14px;
            font-weight: 600;
            color: #FF9500;
        }

        .status-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            height: 100%;
            width: 60%;
            background: linear-gradient(90deg, #4A7CF7, #6C5CE7);
            border-radius: 4px;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% {
                width: 30%;
            }
            50% {
                width: 70%;
            }
            100% {
                width: 30%;
            }
        }

        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 32px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 16px 12px;
        }

        .feature-item i {
            font-size: 24px;
            color: #4A7CF7;
            margin-bottom: 8px;
        }

        .feature-item .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .contact-btn {
            display: inline-block;
            padding: 14px 32px;
            background: #4A7CF7;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .contact-btn:hover {
            background: #3A5FC7;
            transform: scale(1.02);
            box-shadow: 0 8px 32px rgba(74, 124, 247, 0.3);
        }

        .contact-btn i {
            margin-right: 8px;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
        }

        @media (max-width: 480px) {
            .features-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .logo {
                width: 64px;
                height: 64px;
            }
            .app-name {
                font-size: 22px;
            }
            .title {
                font-size: 22px;
            }
            .maintenance-icon {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="logo-container">
            <img src="https://i.ibb.co/TBhtwyMg/e37282e92d9e.jpg" alt="GRAM TOWN" class="logo">
            <div class="app-name">GRAM TOWN</div>
        </div>

        <div class="maintenance-icon">
            <i class="fas fa-tools"></i>
        </div>

        <h1 class="title">Under Maintenance</h1>

        <div class="status-card">
            <div class="status-row">
                <span class="status-dot"></span>
                <span class="status-text">Maintenance in Progress</span>
            </div>
            <div class="status-desc">Estimated completion in a few hours</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="features-grid">
            <div class="feature-item">
                <i class="fas fa-rocket"></i>
                <div class="label">Performance</div>
            </div>
            <div class="feature-item">
                <i class="fas fa-shield-alt"></i>
                <div class="label">Security</div>
            </div>
            <div class="feature-item">
                <i class="fas fa-bolt"></i>
                <div class="label">Speed</div>
            </div>
            <div class="feature-item">
                <i class="fas fa-gem"></i>
                <div class="label">Features</div>
            </div>
        </div>

        <a href="https://t.me/GramTownNews" class="contact-btn" target="_blank">
            <i class="fas fa-paper-plane"></i> Follow News
        </a>

    </div>
</body>
    </html>
