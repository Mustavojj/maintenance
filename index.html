<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GRAM HUNTERS 🎯 - Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <style>
        :root {
            --primary: #4A90D9;
            --primary-dark: #2563EB;
            --primary-light: #60A5FA;
            --primary-glow: rgba(74, 144, 217, 0.5);
            --theme-gradient: linear-gradient(135deg, #4A90D9, #2563EB, #1D4ED8);
            --theme-color: #4A90D9;
            --theme-glow: rgba(74, 144, 217, 0.5);
            --success: #2ecc71;
            --warning: #f39c12;
            --error: #e74c3c;
            --bg-dark: #0a0a0f;
            --bg-card: rgba(15, 20, 35, 0.9);
            --bg-elevated: rgba(10, 15, 30, 0.98);
            --border-radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        img {
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(74, 144, 217, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a0f 0%, #0d1220 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .maintenance-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(74, 144, 217, 0.2);
            border-radius: var(--border-radius);
            padding: 40px 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.6),
                0 0 60px rgba(74, 144, 217, 0.15);
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .maintenance-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(74, 144, 217, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        .maintenance-container > * {
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .maintenance-logo-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .maintenance-logo-wrapper::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: var(--theme-gradient);
            opacity: 0.3;
            filter: blur(20px);
            animation: logoPulse 2s ease-in-out infinite;
        }

        .maintenance-logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--theme-color);
            box-shadow: 0 0 30px var(--theme-glow);
            position: relative;
            z-index: 1;
        }

        @keyframes logoPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.6;
            }
        }

        .maintenance-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 42px;
            height: 42px;
            background: var(--theme-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            border: 3px solid var(--bg-dark);
            box-shadow: 0 4px 16px var(--theme-glow);
            z-index: 2;
            animation: iconSpin 3s ease-in-out infinite;
        }

        @keyframes iconSpin {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-15deg) scale(1.1); }
            75% { transform: rotate(15deg) scale(1.1); }
        }

        .maintenance-title {
            font-size: 1.6rem;
            font-weight: 900;
            background: var(--theme-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .maintenance-subtitle {
            font-size: 0.95rem;
            color: var(--primary-light);
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .maintenance-subtitle i {
            animation: iconBlink 1.5s ease-in-out infinite;
        }

        @keyframes iconBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .maintenance-message {
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 28px;
            padding: 0 8px;
        }

        .maintenance-progress {
            margin-bottom: 24px;
        }

        .maintenance-progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(74, 144, 217, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin-bottom: 10px;
        }

        .maintenance-progress-fill {
            height: 100%;
            background: var(--theme-gradient);
            border-radius: 10px;
            box-shadow: 0 0 15px var(--theme-glow);
            animation: progressShine 2.5s ease-in-out infinite;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .maintenance-progress-fill::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shine 2s ease-in-out infinite;
        }

        @keyframes progressShine {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .maintenance-progress-text {
            font-size: 0.7rem;
            color: #888;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .maintenance-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .maintenance-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--theme-color);
            animation: dotBounce 1.4s ease-in-out infinite;
        }

        .maintenance-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .maintenance-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotBounce {
            0%, 60%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px) scale(1.2);
                opacity: 1;
            }
        }

        .maintenance-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .maintenance-btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 60px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .maintenance-btn.primary {
            background: var(--theme-gradient);
            color: #fff;
            box-shadow: 0 6px 24px var(--theme-glow);
        }

        .maintenance-btn.primary:active {
            transform: scale(0.96);
        }

        .maintenance-btn.secondary {
            background: rgba(74, 144, 217, 0.1);
            color: var(--primary-light);
            border: 1px solid rgba(74, 144, 217, 0.2);
        }

        .maintenance-btn.secondary:active {
            transform: scale(0.96);
            background: rgba(74, 144, 217, 0.2);
        }

        .maintenance-info {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(74, 144, 217, 0.1);
        }

        .maintenance-info-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.7rem;
            color: #666;
            font-weight: 600;
        }

        .maintenance-info-row i {
            color: var(--theme-color);
            font-size: 0.75rem;
        }

        .maintenance-info-row + .maintenance-info-row {
            margin-top: 8px;
        }

        @media (max-width: 400px) {
            .maintenance-container {
                padding: 32px 22px;
            }
            .maintenance-title {
                font-size: 1.4rem;
            }
            .maintenance-logo-wrapper {
                width: 90px;
                height: 90px;
            }
            .maintenance-icon {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--theme-color);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="maintenance-container">
    <div class="maintenance-logo-wrapper">
        <img src="https://slho.shop/i/8067" class="maintenance-logo" alt="GRAM HUNTERS">
        <div class="maintenance-icon">
            <i class="fas fa-tools"></i>
        </div>
    </div>

    <h1 class="maintenance-title">Under Maintenance</h1>
    <div class="maintenance-subtitle">
        <i class="fas fa-wrench"></i>
        <span>We're Upgrading</span>
        <i class="fas fa-wrench"></i>
    </div>

    <p class="maintenance-message">
        <i class="fas fa-info-circle" style="color: #f39c12; margin-right: 4px;"></i>
        Our team is performing scheduled maintenance to improve your experience.
        We'll be back shortly with exciting new features.
        <br><br>
        <i class="fas fa-heart" style="color: #e74c3c;"></i>
        Thank you for your patience.
    </p>

    <div class="maintenance-progress">
        <div class="maintenance-progress-bar">
            <div class="maintenance-progress-fill"></div>
        </div>
        <div class="maintenance-progress-text">Maintenance in progress...</div>
    </div>

    <div class="maintenance-dots">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="maintenance-actions">
        <button class="maintenance-btn primary" onclick="refreshPage()">
            <i class="fas fa-redo"></i>
            <span>Try Again</span>
        </button>
        <a href="https://t.me/GRAM_Huntrs" target="_blank" class="maintenance-btn secondary">
            <i class="fab fa-telegram"></i>
            <span>Get Updates</span>
        </a>
    </div>

    <div class="maintenance-info">
        <div class="maintenance-info-row">
            <i class="fas fa-clock"></i>
            <span>Estimated downtime: Short</span>
        </div>
        <div class="maintenance-info-row">
            <i class="fas fa-shield-alt"></i>
            <span>All data is safe</span>
        </div>
    </div>
</div>

<script>
    function refreshPage() {
        try {
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        } catch (e) {}
        window.location.reload();
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (window.Telegram?.WebApp) {
            try {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                window.Telegram.WebApp.setHeaderColor('#0a0a0f');
            } catch (e) {}
        }
    });
</script>

</body>
</html>
